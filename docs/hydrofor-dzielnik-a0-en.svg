<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title description">
  <title id="title">Voltage divider and A0 filter</title>
  <desc id="description">The transducer output OUT connects through R1, nominally 10 kΩ, to the ADS1115 A0 input. R2, nominally 10 kΩ, and C4ext, 100 nF, are in parallel between A0 and common ground. The transducer and ADS1115 share this ground. The nominal A0 range is about 0.25–2.25 V for an OUT range of 0.5–4.5 V.</desc>
  <style>
    text {font-family:"Segoe UI",Arial,sans-serif; fill:#152638}
    .title {font-size:49px; font-weight:700}
    .subtitle {font-size:24px; fill:#425671}
    .device {font-size:22px; font-weight:700}
    .label {font-size:25px; font-weight:700}
    .terminal {font-size:17px; font-weight:700; fill:#35485b}
    .annotation {font-size:22px; fill:#425671}
    .formula {font-size:27px; font-weight:700; fill:#087366}
    .panel {fill:#fff; stroke:#c4d1de; stroke-width:2}
    .block {fill:#f2f6fa; stroke:#a9bed0; stroke-width:2}
    .note {fill:#f2f6fa}
    .signal-text {fill:#087366}
    .signal,.symbol,.ground {fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
    .signal {stroke:#087366}
    .symbol,.ground {stroke:#35485b}
    .signal-dot {fill:#087366}
    .ground-dot {fill:#35485b}
    .component {fill:#fff; stroke:#087366; stroke-width:4}
  </style>

  <rect width="1400" height="790" fill="#fff"/>
  <text x="56" y="83" class="title">Voltage divider and A0 filter</text>
  <text x="58" y="124" class="subtitle">Pump pressure monitor analog path · 0–150 PSI transducer → ADS1115</text>

  <rect x="44" y="164" width="1312" height="450" rx="16" class="panel"/>
  <rect x="88" y="280" width="242" height="138" rx="12" class="block"/>
  <rect x="1080" y="280" width="232" height="138" rx="12" class="block"/>

  <text x="105" y="317" class="device">Pressure transducer</text>
  <text x="308" y="354" class="label signal-text" text-anchor="end">OUT</text>
  <text x="308" y="380" class="annotation" text-anchor="end">0.5–4.5 V</text>
  <text x="209" y="406" class="terminal" text-anchor="middle">GND</text>

  <text x="1102" y="317" class="device">ADS1115</text>
  <text x="1102" y="354" class="label signal-text">A0</text>
  <text x="1102" y="380" class="annotation">analog input</text>
  <text x="1196" y="406" class="terminal" text-anchor="middle">GND</text>

  <text x="449" y="303" class="label" text-anchor="middle">R1 · 10 kΩ</text>
  <text x="778" y="234" class="label signal-text" text-anchor="middle">A0 junction</text>
  <text x="778" y="263" class="annotation signal-text" text-anchor="middle">0.25–2.25 V nominal</text>

  <path d="M 330 347 H 405" class="signal" data-net="OUT"/>
  <rect x="405" y="332" width="88" height="30" class="component" data-part="R1"/>
  <path d="M 493 347 H 1080 M 680 347 V 405 M 878 347 V 433" class="signal" data-net="A0"/>
  <circle cx="680" cy="347" r="6" class="signal-dot"/>
  <circle cx="878" cy="347" r="6" class="signal-dot"/>

  <rect x="665" y="405" width="30" height="78" class="component" data-part="R2"/>
  <text x="646" y="437" class="label" text-anchor="end">R2</text>
  <text x="646" y="467" class="annotation" text-anchor="end">10 kΩ</text>

  <path d="M 854 433 H 902 M 854 451 H 902" class="symbol" data-part="C4ext"/>
  <text x="913" y="437" class="label">C4ext</text>
  <text x="913" y="467" class="annotation">104 · 100 nF</text>

  <path d="M 209 418 V 543 H 1196 V 418 M 680 483 V 543 M 878 451 V 543 M 765 543 V 564" class="ground" data-net="GND"/>
  <circle cx="680" cy="543" r="6" class="ground-dot"/>
  <circle cx="765" cy="543" r="6" class="ground-dot"/>
  <circle cx="878" cy="543" r="6" class="ground-dot"/>
  <path d="M 746 564 H 784 M 752 573 H 778 M 759 582 H 771" class="ground"/>
  <text x="791" y="580" class="annotation">Common ground (GND)</text>

  <rect x="44" y="642" width="642" height="112" rx="12" class="note"/>
  <text x="68" y="681" class="label">Nominal DC voltage ratio</text>
  <text x="68" y="719" class="formula">V(A0) ≈ V(OUT) / 2</text>
  <rect x="710" y="642" width="646" height="112" rx="12" class="note"/>
  <text x="734" y="681" class="label">C4ext in parallel with R2</text>
  <text x="734" y="719" class="annotation">Between A0 and GND · non-polarized capacitor</text>

</svg>
